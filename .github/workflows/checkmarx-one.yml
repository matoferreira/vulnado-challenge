name: Checkmarx One Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  actions: read
  pull-requests: write
  security-events: write

jobs:
  build:
    name: Checkmarx Policy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkmarx One CLI Action
        uses: checkmarx/ast-github-action@main
        with:
          project_name: ${{ github.repository }}
          cx_tenant: ${{ vars.CX_TENANT }}
          base_uri: ${{ vars.CX_BASE_URI }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          additional_params: --report-format sarif --output-path . --sast-incremental

      - name: Upload SARIF file
        if: ${{ !cancelled() && hashFiles('cx_result.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cx_result.sarif
          category: checkmarx-one
