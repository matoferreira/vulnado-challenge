version: "3"
services:
  vulnado:
    build: .
    ports:
      - 8080:8080
    links:
      - db
      - internal_site
    environment:
      - PGPASSWORD=vulnado
      - PGDATABASE=vulnado
      - PGHOST=db:5432
      - PGUSER=postgres
    depends_on:
      db:
        condition: service_healthy

  client:
    build: client
    ports:
      - 1337:80

  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=vulnado
      - POSTGRES_DB=vulnado
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vulnado"]
      interval: 2s
      timeout: 5s
      retries: 30

  internal_site:
    build: internal_site
